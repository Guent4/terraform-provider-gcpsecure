# Terraform Provider release workflow.
# Creates a GitHub Release and uploads provider binaries when a version tag is pushed.
# Used by the Terraform Registry to publish the provider.
#
# Prerequisites:
# 1. Add repository secrets: GPG_PRIVATE_KEY, PASSPHRASE (optional, for GPG key passphrase).
# 2. Add your GPG public key to Terraform Registry: https://registry.terraform.io/settings/gpg-keys
# 3. Publish the provider from the Registry UI (Publish > Providers) linking this repo.
#
# To release: create and push a tag, e.g. git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-rc[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-alpha[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-beta[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Terraform Provider Release
    uses: hashicorp/ghaction-terraform-provider-release/.github/workflows/community.yml@v4
    secrets:
      gpg-private-key: '${{ secrets.GPG_PRIVATE_KEY }}'
      gpg-private-key-passphrase: '${{ secrets.PASSPHRASE }}'
    with:
      setup-go-version-file: 'go.mod'
      git-ref: ${{ github.ref }}
